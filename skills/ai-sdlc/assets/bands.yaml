# Control bands for production monitoring (Maintain phase).
# Detection is deterministic: mean/std over a rolling 30-day window with
# Western Electric rules. The agent is invoked only after a band is breached.
#
# Location: this file lives under iterations/ (iterations/bands.yaml) with the
# rest of the process skeleton. It is configuration for the Maintain phase's
# detect_bands.py; edit tiers/routes here, not in code.

metrics:
  ci_test_failure_rate:
    baseline: rolling_30d
    rules: western_electric
    tiers:
      1sigma: { action: log }
      2sigma: { action: diagnose, tools: "Read,Grep,Bash(gh run view *)" }
      3sigma: { action: propose, routes: ["pull_request", "runbook:rollback-deploy"] }

  post_deploy_5xx_rate:
    baseline: rolling_30d
    rules: western_electric
    tiers:
      1sigma: { action: log }
      2sigma: { action: diagnose, tools: "Read,Grep,Bash(gh run view *)" }
      3sigma: { action: propose, routes: ["pull_request", "runbook:rollback-deploy"] }

  pr_cycle_time:
    baseline: rolling_30d
    rules: western_electric
    tiers:
      1sigma: { action: log }
      2sigma: { action: diagnose, tools: "Read,Grep,Bash(gh run view *)" }
      3sigma: { action: propose, routes: ["pull_request", "runbook:rollback-deploy"] }
